@keyframes konfettiFall {

    from {

    }

    to {

        transform:
            translateY(120vh)

<script>

let overlayTimer = null;
let hjemmemaal = 0;
let bortemaal = 0;
const debugMode = false;

function oppdaterScore() {

    document.getElementById(
        "hjemmescore"
    ).textContent = hjemmemaal;

    document.getElementById(
        "bortescore"
    ).textContent = bortemaal;
}

const overlay =
    document.getElementById("overlay");


function visOverlay(tekst, varighet = 5000) {

    clearTimeout(overlayTimer);

    if (!tekst) {
        overlay.style.display = "none";
        overlay.innerHTML = "";
        return;
    }

    overlay.innerHTML = tekst;
    overlay.style.display = "flex";

    overlayTimer = setTimeout(() => {
        overlay.style.display = "none";
        overlay.innerHTML = "";
    }, varighet);
}


function visMaal(
    lagnavn
) {

    maalFeiring(
        lagnavn
    );
}

function maalFeiring(
    lagnavn
) {

    testSpiller();

    setTimeout(() => {

        testBall();

    }, 1000);

    setTimeout(() => {

    startKonfetti();
 
    }, 600);

    setTimeout(() => {

        visOverlay(
    "⚽ MÅL ⚽<br><br>" +
    lagnavn
);

    }, 1800
			  
	);

}

function visTimeout() {

    visOverlay("⏱ TIMEOUT");
}

function visFairPlay() {

    visOverlay("🤝 FAIR PLAY");
}

/*
Klar for kobling mot hovedappen senere
*/

window.addEventListener(
    "message",
    function(event) {

        if (
            !event.data ||
            typeof event.data !== "object"
        ) {
            return;
        }

        switch(event.data.type) {

            case "kampklokke":

                document
                    .getElementById(
                        "kampklokke"
                    )
                    .textContent =
                    event.data.tid;

                break;

            case "kampstatus":

                document
                    .getElementById(
                        "kampstatus"
                    )
                    .textContent =
                    event.data.status;

                break;

	    case "score":

   		 document
       		 .getElementById("hjemmescore")
        	.textContent =
 	         event.data.hjemme;

	         document
        	 .getElementById("bortescore")
                 .textContent =
                 event.data.borte;

    		break;

                case "maal":

    		visMaal(
        	event.data.lag
    		);

    		break;

            case "timeout":
                visTimeout();
                break;

	    case "timeoutinfo":

    		if (!event.data.tekst) {

        	overlay.style.display = "none";
        	overlay.innerHTML = "";

    	} else {

        	visOverlay(
           	 event.data.tekst
        );

    }

    break;

            case "fairplay":

    	    spillFairplayVideo();

	    break;

	    case "utvisninger":

    		oppdaterUtvisninger(
        	event.data.hjemmelag,
        	event.data.bortelag
    		);

    		break;

	    case "lag":

    	    document
       	        .getElementById("hjemmelogo")
        	.src =
        	event.data.hjemmelogo;

    	    document
        	.getElementById("bortelaglogo")
        	.src =
        	event.data.bortelogo;

	    document
    		.getElementById(
        	"hjemmelagnavn"
    		)
    		.textContent =
    		event.data.hjemmenavn;

	    document
    		.getElementById(
        	"bortelagnavn"
    		)
    		.textContent =
    		event.data.bortenavn;

    	    break;
        }
    }
);

function testSpiller() {

    const spiller =
        document.getElementById(
            "spillerContainer"
        );

    spiller.classList.add(
        "testHopp"
    );

    setTimeout(() => {

        spiller.classList.remove(
            "testHopp"
        );

    }, 1000);
}

function testBall() {

    const ball =
        document.getElementById(
            "maalBall"
        );

    ball.style.display = "block";

    ball.style.animation =
        "ballFlyr 2s linear";

    setTimeout(() => {

        ball.style.display = "none";

        ball.style.animation = "";

    }, 1000);
}


function startKonfetti() {

    const felt =
        document.getElementById(
            "konfetti"
        );

    felt.innerHTML = "";

    felt.style.display = "block";

    const farger = [

        "#00d4ff",
        "#ffcc00",
        "#ffffff",
        "#ff6600"
    ];

    for (let i = 0; i < 120; i++) {

        const bit =
            document.createElement("div");

        bit.classList.add(
            "konfettiBit"
        );

        bit.style.left =
            Math.random() * 100 + "%";

        bit.style.background =
            farger[
                Math.floor(
                    Math.random() *
                    farger.length
                )
            ];

        bit.style.animationDelay =
            Math.random() * 2 + "s";

        felt.appendChild(bit);
    }

    setTimeout(() => {

        felt.style.display = "none";

    }, 5000);
}

function oppdaterUtvisninger(
    hjemmelag,
    bortelag
) {

    const homeTittel =
        document.getElementById(
            "utvisningTittelHome"
        );

    const awayTittel =
        document.getElementById(
            "utvisningTittelAway"
        );

    const homeListe =
        document.getElementById(
            "utvisningerHome"
        );

    const awayListe =
        document.getElementById(
            "utvisningerAway"
        );

    /* Hjemmelag */

    if (hjemmelag.length === 0) {

        homeTittel.style.display =
            "none";

        homeListe.style.display =
            "none";

        homeListe.innerHTML = "";
    }
    else {

        homeTittel.style.display =
            "block";

        homeListe.style.display =
            "flex";

        homeListe.innerHTML = "";

        hjemmelag.forEach(
            utvisning => {

                const minutter =
                    Math.floor(
                        utvisning.sekunder / 60
                    );

                const sekunder =
                    utvisning.sekunder % 60;

                const tid =
                    String(minutter)
                    .padStart(2,"0") +
                    ":" +
                    String(sekunder)
                    .padStart(2,"0");

               const harRodtKort =

    utvisning.antallUtvisninger >= 3 ||

    utvisning.direkteRodtKort;

let kortKlasse =

    harRodtKort
        ? "utvisningskort rodtkort"
        : "utvisningskort";

if (
    utvisning.sekunder <= 5
) {
    kortKlasse += " blink";
}

homeListe.innerHTML += `
<div class="${kortKlasse}">
    <div class="utvisningSpillerNr">
    #${utvisning.spiller}
</div>

    <div class="utvisningTid">
        ${tid}
    </div>
</div>
`;
            }
        );
    }

    /* Bortelag */

    if (bortelag.length === 0) {

        awayTittel.style.display =
            "none";

        awayListe.style.display =
            "none";

        awayListe.innerHTML = "";
    }
    else {

        awayTittel.style.display =
            "block";

        awayListe.style.display =
            "flex";

        awayListe.innerHTML = "";

        bortelag.forEach(
            utvisning => {

                const minutter =
                    Math.floor(
                        utvisning.sekunder / 60
                    );

                const sekunder =
                    utvisning.sekunder % 60;

                const tid =
                    String(minutter)
                    .padStart(2,"0") +
                    ":" +
                    String(sekunder)
                    .padStart(2,"0");

               const harRodtKort =

    utvisning.antallUtvisninger >= 3 ||

    utvisning.direkteRodtKort;

let kortKlasse =

    harRodtKort
        ? "utvisningskort rodtkort"
        : "utvisningskort";

if (
    utvisning.sekunder <= 5
) {
    kortKlasse += " blink";
}

awayListe.innerHTML += `
<div class="${kortKlasse}">
   <div class="utvisningSpillerNr">
    #${utvisning.spiller}
 </div>
    <div class="utvisningTid">
        ${tid}
    </div>
</div>`;
            }
        );
    }
}

function spillFairplayVideo() {

    const video =
        document.getElementById(
            "fairplayVideo"
        );

    video.style.display =
        "block";

    video.currentTime = 0;

    video.play();

    video.onerror = function () {

        video.style.display =
            "none";

        console.log(
            "Kunne ikke spille Fair Play-video"
        );
    };
video.onended = function () {

    video.style.display =
        "none";

    if (
        window.opener &&
        !window.opener.closed
    ) {
        window.opener.postMessage(
            {
                type: "fairplayFerdig"
            },
            "*"
        );
    }

};
}

if (
    "serviceWorker"
    in navigator
) {

    navigator.serviceWorker

            );

        });

}

// ============================================================
// REKLAMEDEL AV SKJERMEN
// ============================================================

// Inneholder alle reklamer som lastes fra reklame.json.
let reklamer = [];

// Inneholder bare aktive reklamer som kan vises under kamp.
let kampReklamer = [];

// Inneholder bare aktive reklamer som kan vises i pausen.
let pauseReklamer = [];

// Holder rede på hvilken kampreklame som vises.
let kampReklameIndeks = 0;

// Holder rede på hvilken pausereklame som vises.
let pauseReklameIndeks = 0;

// Forteller hvilken reklamemodus som er aktiv.
// Mulige verdier er "kamp" og "pause".
let aktivReklameModus = "kamp";
	
// Inneholder ID-en til setTimeout som styrer rotasjonen.
// Vi trenger denne for å kunne stoppe en pågående rotasjon.
let reklameTimer = null;


// ------------------------------------------------------------
// LASTER REKLAMEDATA
// ------------------------------------------------------------

async function lastReklamer() {
    try {
        console.log("Laster reklamer fra data/reklame.json...");

        const response = await fetch("data/reklame.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                `Kunne ikke laste reklame.json. HTTP-status: ${response.status}`
            );
        }

        const data = await response.json();

        if (!Array.isArray(data.reklamer)) {
            throw new Error(
                'reklame.json inneholder ikke en gyldig "reklamer"-liste.'
            );
        }

        reklamer = data.reklamer;

        console.log("Reklamedata lastet:", data);
        console.log("Antall reklamer totalt:", reklamer.length);

		klargjorPauseReklamer();
        klargjorKampReklamer();

    } catch (error) {
        reklamer = [];
        kampReklamer = [];

        stoppReklameRotasjon();
        skjulReklamefelt();

        console.error("Feil ved lasting av reklamer:", error);
    }
}


// ------------------------------------------------------------
// FILTRERER OG SORTERER KAMPREKLAMENE
// ------------------------------------------------------------

function klargjorKampReklamer() {
    kampReklamer = reklamer
        .filter(reklame => {
            const erAktiv = reklame.aktiv === true;

            const erBilde = reklame.type === "bilde";

            const harGyldigFil =
                typeof reklame.fil === "string" &&
                reklame.fil.trim() !== "";

            const harVisningsliste =
                Array.isArray(reklame.visning);

            const kanVisesUnderKamp =
                harVisningsliste &&
                reklame.visning.includes("kamp");

            return (
                erAktiv &&
                erBilde &&
                harGyldigFil &&
                kanVisesUnderKamp
            );
        })
        .sort((a, b) => {
            const rekkefolgeA =
                Number.isFinite(Number(a.rekkefolge))
                    ? Number(a.rekkefolge)
                    : 9999;

            const rekkefolgeB =
                Number.isFinite(Number(b.rekkefolge))
                    ? Number(b.rekkefolge)
                    : 9999;

            return rekkefolgeA - rekkefolgeB;
        });

    console.log(
        "Aktive reklamer for kamp:",
        kampReklamer
    );

    startKampReklamer();
}


// ------------------------------------------------------------
// FILTRERER OG SORTERER PAUSEREKLAMENE
// ------------------------------------------------------------

function klargjorPauseReklamer() {
    pauseReklamer = reklamer
        .filter(reklame => {
            const erAktiv = reklame.aktiv === true;

            const erBilde = reklame.type === "bilde";

            const harGyldigFil =
                typeof reklame.fil === "string" &&
                reklame.fil.trim() !== "";

            const harVisningsliste =
                Array.isArray(reklame.visning);

            const kanVisesIPause =
                harVisningsliste &&
                reklame.visning.includes("pause");

            return (
                erAktiv &&
                erBilde &&
                harGyldigFil &&
                kanVisesIPause
            );
        })
        .sort((a, b) => {
            const rekkefolgeA =
                Number.isFinite(Number(a.rekkefolge))
                    ? Number(a.rekkefolge)
                    : 9999;

            const rekkefolgeB =
                Number.isFinite(Number(b.rekkefolge))
                    ? Number(b.rekkefolge)
                    : 9999;

            return rekkefolgeA - rekkefolgeB;
        });

    console.log(
        "Aktive reklamer for pause:",
        pauseReklamer
    );
}

function settReklameModus(modus) {
    const container =
        document.getElementById("reklameContainer");

    if (!container) {
        console.error(
            "Fant ikke reklameContainer."
        );

        return;
    }

    container.classList.remove(
        "reklame-kamp",
        "reklame-pause"
    );

    if (modus === "kamp") {
        container.classList.add("reklame-kamp");
    }

    if (modus === "pause") {
        container.classList.add("reklame-pause");
    }
}
	
// ------------------------------------------------------------
// STARTER KAMPREKLAMENE
// ------------------------------------------------------------

function startKampReklamer() {
    aktivReklameModus = "kamp";

    stoppReklameRotasjon();

    kampReklameIndeks = 0;

    settReklameModus("kamp");

    if (kampReklamer.length === 0) {
        console.log(
            "Ingen aktive kampreklamer. Reklamefeltet skjules."
        );

        skjulReklamefelt();
		skjulReklameOverskrift();
        return;
    }

    visReklamefelt();
	visReklameOverskrift();
    visNesteKampReklame();
}


// ------------------------------------------------------------
// VISER NESTE REKLAME
// ------------------------------------------------------------

function visNesteKampReklame() {
    if (kampReklamer.length === 0) {
        skjulReklamefelt();
        return;
    }

    if (kampReklameIndeks >= kampReklamer.length) {
        kampReklameIndeks = 0;
    }

    const reklame = kampReklamer[kampReklameIndeks];

    visKampReklame(reklame);
}


// ------------------------------------------------------------
// VISER ÉN BESTEMT KAMPREKLAME
// ------------------------------------------------------------

function visKampReklame(reklame) {
    const container =
        document.getElementById("reklameContainer");

    const bilde =
        document.getElementById("reklameBilde");

    if (!container || !bilde) {
        console.error(
            "Fant ikke reklameContainer eller reklameBilde."
        );

        stoppReklameRotasjon();
        return;
    }

    if (!reklame || !reklame.fil) {
        console.error(
            "Reklamen mangler en gyldig bildefil."
        );

        gaaTilNesteKampReklame();
        return;
    }

    bilde.onload = function () {
    if (aktivReklameModus !== "kamp") {
        return;
    }

    visReklamefelt();

    console.log(
        "Viser kampreklame:",
        reklame.navn || reklame.id
    );

    planleggNesteKampReklame(reklame);
};

    bilde.onerror = function () {
    if (aktivReklameModus !== "kamp") {
        return;
    }

    console.error(
        "Kunne ikke laste reklamebildet:",
        reklame.fil
    );

    gaaTilNesteKampReklame();
};

    bilde.alt = reklame.navn || "Reklame";
    bilde.src = reklame.fil;
}


// ------------------------------------------------------------
// STARTER PAUSEREKLAMENE
// ------------------------------------------------------------

function startPauseReklamer() {
    aktivReklameModus = "pause";

	skjulReklameOverskrift();	
    stoppReklameRotasjon();

    pauseReklameIndeks = 0;

    settReklameModus("pause");

    if (pauseReklamer.length === 0) {
        console.log(
            "Ingen aktive pausereklamer. Reklamefeltet skjules."
        );

        skjulReklamefelt();
        return;
    }

    visReklamefelt();
    visNestePauseReklame();
}

// ------------------------------------------------------------
// VISER NESTE PAUSEREKLAME
// ------------------------------------------------------------

function visNestePauseReklame() {
    if (aktivReklameModus !== "pause") {
        return;
    }

    if (pauseReklamer.length === 0) {
        skjulReklamefelt();
        return;
    }

    if (pauseReklameIndeks >= pauseReklamer.length) {
        pauseReklameIndeks = 0;
    }

    const reklame =
        pauseReklamer[pauseReklameIndeks];

    visPauseReklame(reklame);
}

// ------------------------------------------------------------
// VISER ÉN BESTEMT PAUSEREKLAME
// ------------------------------------------------------------

function visPauseReklame(reklame) {
    const container =
        document.getElementById("reklameContainer");

    const bilde =
        document.getElementById("reklameBilde");

    if (!container || !bilde) {
        console.error(
            "Fant ikke reklameContainer eller reklameBilde."
        );

        stoppReklameRotasjon();
        return;
    }

    if (!reklame || !reklame.fil) {
        console.error(
            "Pausereklamen mangler en gyldig bildefil."
        );

        gaaTilNestePauseReklame();
        return;
    }

    bilde.onload = function () {
        if (aktivReklameModus !== "pause") {
            return;
        }

        visReklamefelt();

        console.log(
            "Viser pausereklame:",
            reklame.navn || reklame.id
        );

        planleggNestePauseReklame(reklame);
    };

    bilde.onerror = function () {
        if (aktivReklameModus !== "pause") {
            return;
        }

        console.error(
            "Kunne ikke laste pausereklamen:",
            reklame.fil
        );

        gaaTilNestePauseReklame();
    };

    bilde.alt = reklame.navn || "Pausereklame";
    bilde.src = reklame.fil;
}

// ------------------------------------------------------------
// PLANLEGGER NESTE PAUSEREKLAME
// ------------------------------------------------------------

function planleggNestePauseReklame(reklame) {
    stoppReklameRotasjon();

    if (aktivReklameModus !== "pause") {
        return;
    }

    if (pauseReklamer.length <= 1) {
        console.log(
            "Kun én pausereklame. Rotasjon startes ikke."
        );

        return;
    }

    const oppgittVarighet =
        Number(reklame.varighet);

    const varighetISekunder =
        Number.isFinite(oppgittVarighet) &&
        oppgittVarighet > 0
            ? oppgittVarighet
            : 10;

    const varighetIMillisekunder =
        varighetISekunder * 1000;

    console.log(
        `Neste pausereklame vises om ${varighetISekunder} sekunder.`
    );

    reklameTimer = setTimeout(() => {
        if (aktivReklameModus !== "pause") {
            return;
        }

        gaaTilNestePauseReklame();
    }, varighetIMillisekunder);
}

// ------------------------------------------------------------
// GÅR VIDERE TIL NESTE PAUSEREKLAME
// ------------------------------------------------------------

function gaaTilNestePauseReklame() {
    stoppReklameRotasjon();

    if (aktivReklameModus !== "pause") {
        return;
    }

    if (pauseReklamer.length === 0) {
        skjulReklamefelt();
        return;
    }

    pauseReklameIndeks =
        (pauseReklameIndeks + 1) %
        pauseReklamer.length;

    visNestePauseReklame();
}
	
// ------------------------------------------------------------
// PLANLEGGER NESTE REKLAME
// ------------------------------------------------------------

function planleggNesteKampReklame(reklame) {
    stoppReklameRotasjon();

    if (kampReklamer.length <= 1) {
        console.log(
            "Kun én kampreklame. Rotasjon startes ikke."
        );

        return;
    }

    const oppgittVarighet = Number(reklame.varighet);

    const varighetISekunder =
        Number.isFinite(oppgittVarighet) &&
        oppgittVarighet > 0
            ? oppgittVarighet
            : 10;

    const varighetIMillisekunder =
        varighetISekunder * 1000;

    console.log(
        `Neste reklame vises om ${varighetISekunder} sekunder.`
    );

    reklameTimer = setTimeout(() => {
        gaaTilNesteKampReklame();
    }, varighetIMillisekunder);
}


// ------------------------------------------------------------
// GÅR VIDERE TIL NESTE KAMPREKLAME
// ------------------------------------------------------------

function gaaTilNesteKampReklame() {
    stoppReklameRotasjon();

    if (kampReklamer.length === 0) {
        skjulReklamefelt();
        return;
    }

    kampReklameIndeks =
        (kampReklameIndeks + 1) % kampReklamer.length;

    visNesteKampReklame();
}


// ------------------------------------------------------------
// STOPPER EN EVENTUELL PÅGÅENDE TIMER
// ------------------------------------------------------------

function stoppReklameRotasjon() {
    if (reklameTimer !== null) {
        clearTimeout(reklameTimer);
        reklameTimer = null;
    }
}


// ------------------------------------------------------------
// VISER OG SKJULER REKLAMEFELTET
// ------------------------------------------------------------

function visReklameOverskrift() {
    const overskrift =
        document.getElementById("reklameOverskrift");

    if (!overskrift) {
        console.error(
            "Fant ikke reklameOverskrift."
        );

        return;
    }

    overskrift.style.display = "block";
}


function skjulReklameOverskrift() {
    const overskrift =
        document.getElementById("reklameOverskrift");

    if (!overskrift) {
        return;
    }

    overskrift.style.display = "none";
}

function visReklamefelt() {
    const container =
        document.getElementById("reklameContainer");

    if (!container) {
        console.error(
            "Fant ikke reklameContainer."
        );

        return;
    }

    container.style.display = "flex";
}


function skjulReklamefelt() {
    const container =
        document.getElementById("reklameContainer");

    const bilde =
        document.getElementById("reklameBilde");

    if (container) {
        container.style.display = "none";
    }

    if (bilde) {
        bilde.removeAttribute("src");
        bilde.alt = "";
    }
}


// ------------------------------------------------------------
// STARTER INNLASTING AV REKLAMENE
// ------------------------------------------------------------

lastReklamer();


// ============================================================
// SLUTT REKLAMEDEL AV SKJERMEN
// ============================================================
</script>
